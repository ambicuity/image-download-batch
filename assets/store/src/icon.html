<!doctype html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;background:transparent;}
  #wrap{width:512px;height:512px;}
  svg{display:block;}
</style></head>
<body><div id="wrap">
<svg id="icon" width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#1c1c26"/><stop offset="1" stop-color="#08080b"/>
    </linearGradient>
    <linearGradient id="amber" gradientUnits="userSpaceOnUse" x1="150" y1="120" x2="380" y2="452">
      <stop offset="0" stop-color="#f6ad6a"/><stop offset="1" stop-color="#e76f51"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.16" r="0.7">
      <stop offset="0" stop-color="#f4a261" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#f4a261" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frameClip"><rect x="120" y="86" width="272" height="188" rx="30"/></clipPath>
  </defs>

  <!-- app tile -->
  <rect x="0" y="0" width="512" height="512" rx="114" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="114" fill="url(#glow)"/>
  <rect x="3" y="3" width="506" height="506" rx="111" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2"/>

  <!-- photo / image frame -->
  <rect x="120" y="86" width="272" height="188" rx="30" fill="#101017"/>
  <g clip-path="url(#frameClip)">
    <circle cx="188" cy="162" r="30" fill="url(#amber)"/>
    <path d="M112 286 L206 190 L262 246 L330 176 L410 286 L410 300 L112 300 Z" fill="#efece6"/>
  </g>
  <rect x="120" y="86" width="272" height="188" rx="30" fill="none" stroke="#efece6" stroke-width="16"/>

  <!-- download arrow -->
  <g stroke="url(#amber)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M256 300 L256 404"/>
    <path d="M196 352 L256 416 L316 352"/>
  </g>
  <path d="M170 452 L342 452" stroke="url(#amber)" stroke-width="46" stroke-linecap="round"/>
</svg>
</div></body></html>
