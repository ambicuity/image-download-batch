name: Release

# Triggers:
#  - push a version tag (v1.0.1, v1.1.0, ...) -> test, build, GitHub Release, Chrome Web Store upload + publish
#  - manual run (Actions tab) -> test, build, Chrome Web Store upload (optionally publish)
#
# Chrome Web Store authentication (first match wins):
#  1. CWS_SERVICE_ACCOUNT_JSON  service-account key added under Account in the CWS Developer Dashboard
#  2. CWS_CLIENT_ID + CWS_CLIENT_SECRET + CWS_REFRESH_TOKEN  OAuth refresh-token flow
# API: v2 when CWS_PUBLISHER_ID is set, otherwise v1.1. CWS_EXTENSION_ID is always required.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish after upload?'
        type: boolean
        default: true
      target:
        description: 'Publish target (v1.1 API only)'
        type: choice
        options: [default, trustedTesters]
        default: default

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Read manifest version
        id: version
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match manifest version $VERSION"; exit 1
          fi

      - name: Run tests
        run: |
          node --test docs/superpowers/tests/bug-regressions.test.cjs
          for t in dedupeUrls filenameTokens flattenDedupeImages upgradeToLargest; do
            node "docs/superpowers/tests/$t.test.cjs"
          done

      - name: Build extension ZIP
        run: |
          chmod +x scripts/build-zip.sh
          scripts/build-zip.sh "image-download-batch-v${{ steps.version.outputs.version }}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: extension-zip
          path: image-download-batch-v${{ steps.version.outputs.version }}.zip

  github-release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: extension-zip

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          NOTES="docs/releases/${TAG}.md"
          if [ -f "$NOTES" ]; then NOTES_ARGS=(--notes-file "$NOTES"); else NOTES_ARGS=(--generate-notes); fi
          gh release create "$TAG" image-download-batch-*.zip --title "Image Download - Batch ${TAG}" "${NOTES_ARGS[@]}" --verify-tag

  chrome-web-store:
    needs: build
    runs-on: ubuntu-latest
    env:
      SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: extension-zip

      # Exchange the key for a token with a signed JWT (OAuth 2.0 JWT bearer grant).
      # Unlike google-github-actions/auth, this needs no IAM Credentials API.
      - name: Authenticate with service account
        id: sa
        if: env.SERVICE_ACCOUNT_JSON != ''
        run: |
          node <<'EOF'
          const crypto = require('crypto');
          const fs = require('fs');
          const key = JSON.parse(process.env.SERVICE_ACCOUNT_JSON);
          const b64 = value => Buffer.from(JSON.stringify(value)).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const claims = {
            iss: key.client_email,
            scope: 'https://www.googleapis.com/auth/chromewebstore',
            aud: key.token_uri,
            iat: now,
            exp: now + 3600
          };
          const unsigned = b64({ alg: 'RS256', typ: 'JWT' }) + '.' + b64(claims);
          const signature = crypto.sign('RSA-SHA256', Buffer.from(unsigned), key.private_key).toString('base64url');
          fetch(key.token_uri, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({
              grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer',
              assertion: unsigned + '.' + signature
            })
          }).then(response => response.json()).then(body => {
            if (!body.access_token) {
              console.log('::error::Service-account token request failed: ' + (body.error_description || body.error || 'no token'));
              process.exit(1);
            }
            console.log('::add-mask::' + body.access_token);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'access_token=' + body.access_token + '\n');
            console.log('Obtained Chrome Web Store access token for ' + key.client_email);
          }).catch(error => {
            console.log('::error::Service-account token request failed: ' + error.message);
            process.exit(1);
          });
          EOF

      - name: Upload & publish
        env:
          SA_TOKEN: ${{ steps.sa.outputs.access_token }}
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          # tags always publish to default; manual runs use the chosen inputs
          DO_PUBLISH: ${{ github.event_name == 'push' && 'true' || inputs.publish }}
          TARGET: ${{ github.event_name == 'push' && 'default' || inputs.target }}
        run: |
          set -euo pipefail
          ZIP=$(ls image-download-batch-*.zip)
          [ -n "${EXTENSION_ID:-}" ] || { echo "::error::Missing secret CWS_EXTENSION_ID"; exit 1; }

          if [ -n "${SA_TOKEN:-}" ]; then
            echo "Authenticated with service account."
            ACCESS_TOKEN="$SA_TOKEN"
          else
            for v in CLIENT_ID CLIENT_SECRET REFRESH_TOKEN; do
              if [ -z "${!v:-}" ]; then echo "::error::Set CWS_SERVICE_ACCOUNT_JSON, or CWS_$v for the OAuth flow"; exit 1; fi
            done
            ACCESS_TOKEN=$(curl -sS "https://oauth2.googleapis.com/token" \
              -d "client_id=$CLIENT_ID" -d "client_secret=$CLIENT_SECRET" \
              -d "refresh_token=$REFRESH_TOKEN" -d "grant_type=refresh_token" | jq -r '.access_token // empty')
            [ -n "$ACCESS_TOKEN" ] || { echo "::error::Failed to obtain OAuth access token"; exit 1; }
          fi
          echo "::add-mask::$ACCESS_TOKEN"

          # call METHOD URL [curl args...] -> prints body; fails on HTTP >= 400
          call() {
            local method=$1 url=$2; shift 2
            local out code
            out=$(mktemp)
            code=$(curl -sS -o "$out" -w '%{http_code}' -X "$method" -H "Authorization: Bearer $ACCESS_TOKEN" "$@" "$url")
            if [ "$code" -ge 400 ]; then
              cat "$out" >&2; echo "::error::$method $url returned HTTP $code" >&2; return 1
            fi
            cat "$out"; echo
          }

          if [ -n "${PUBLISHER_ID:-}" ]; then
            ITEM="publishers/$PUBLISHER_ID/items/$EXTENSION_ID"
            echo "Uploading $ZIP (API v2)..."
            UPLOAD=$(call POST "https://chromewebstore.googleapis.com/upload/v2/$ITEM:upload" \
              -H "Content-Type: application/zip" --data-binary "@$ZIP")
            echo "$UPLOAD"
            STATE=$(echo "$UPLOAD" | jq -r '.uploadState // empty')
            for _ in $(seq 1 30); do
              [ "$STATE" = "IN_PROGRESS" ] || break
              sleep 10
              STATE=$(call GET "https://chromewebstore.googleapis.com/v2/$ITEM:fetchStatus" | jq -r '.lastAsyncUploadState // empty')
            done
            [ "$STATE" = "SUCCEEDED" ] || { echo "::error::Upload state: ${STATE:-unknown}"; exit 1; }
            [ "$DO_PUBLISH" = "true" ] || { echo "Upload complete; publish skipped."; exit 0; }
            echo "Publishing (API v2)..."
            call POST "https://chromewebstore.googleapis.com/v2/$ITEM:publish" \
              -H "Content-Type: application/json" -d '{"publishType":"DEFAULT_PUBLISH"}'
          else
            echo "Uploading $ZIP (API v1.1)..."
            UPLOAD=$(call PUT "https://www.googleapis.com/upload/chromewebstore/v1.1/items/$EXTENSION_ID" \
              -H "x-goog-api-version: 2" -T "$ZIP")
            echo "$UPLOAD"
            STATE=$(echo "$UPLOAD" | jq -r '.uploadState // empty')
            [ "$STATE" = "SUCCESS" ] || { echo "::error::Upload state: ${STATE:-unknown}"; exit 1; }
            [ "$DO_PUBLISH" = "true" ] || { echo "Upload complete; publish skipped."; exit 0; }
            echo "Publishing (API v1.1, target=$TARGET)..."
            PUB=$(call POST "https://www.googleapis.com/chromewebstore/v1.1/items/$EXTENSION_ID/publish?publishTarget=$TARGET" \
              -H "x-goog-api-version: 2" -H "Content-Length: 0")
            echo "$PUB"
            echo "$PUB" | jq -e '(.status // []) | map(select(. == "OK" or . == "ITEM_PENDING_REVIEW")) | length > 0' >/dev/null \
              || { echo "::error::Publish was not accepted"; exit 1; }
          fi
          echo "Submitted for Chrome Web Store review."
